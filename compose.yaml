services:
  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  task-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      TASK_MONGODB_URI: "mongodb://mongo:27017"
      TASK_MONGODB_DATABASE: "task"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
